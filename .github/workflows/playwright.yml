name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Clone music-server repo
        run: |
          git clone https://github.com/${{ github.repository_owner }}/music-server.git $RUNNER_TEMP/music-server

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            $RUNNER_TEMP/music-server/package-lock.json
            $GITHUB_WORKSPACE/package-lock.json

      - name: Checkout matching branch in music-server
        run: |
          cd $RUNNER_TEMP/music-server
          # Try to checkout the same branch as the current workflow
          if git rev-parse --verify origin/${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Checking out matching branch: ${{ github.ref_name }}"
            git checkout ${{ github.ref_name }}
          else
            echo "No matching branch found, using default branch"
          fi

      - name: Install music-server dependencies
        run: npm ci
        working-directory: $RUNNER_TEMP/music-server

      - name: Start backend
        run: |
          LOG_FILE="$RUNNER_TEMP/api.log"
          : > "$LOG_FILE"
          npm run start:test > "$LOG_FILE" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
        working-directory: $RUNNER_TEMP/music-server

      - name: Wait for backend to start
        run: |
          LOG_FILE="$RUNNER_TEMP/api.log"
          PID_FILE="$RUNNER_TEMP/api.pid"
          for i in {1..120}; do
            if grep -Fq 'LOG [IndexerService] [accountId: 1 rootPathId: 2] adding folder' "$LOG_FILE"; then
              echo "Backend startup message detected"
              exit 0
            fi
            if [ -f "$PID_FILE" ] && ! kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "Backend process exited before becoming ready"
              echo "Backend log:"
              cat "$LOG_FILE"
              exit 1
            fi
            echo "Waiting for backend startup message... attempt $i/120"
            sleep 1
          done
          echo "Backend did not emit the expected startup message within 120 seconds"
          exit 1

      - name: Install Playwright test dependencies
        run: npm ci
        working-directory: ./

      - name: Run Playwright tests
        run: npx playwright test

      - name: Backend debugging logs
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/api.log" ]; then
            tail -n 200 "$RUNNER_TEMP/api.log" || true
          else
            echo "No api.log found at $RUNNER_TEMP/api.log"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
