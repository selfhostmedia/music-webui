name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Clone music-server repo
        run: |
          git clone https://github.com/${{ github.repository_owner }}/music-server.git music-server
          cd music-server
          if git rev-parse --verify origin/${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Checking out matching branch: ${{ github.ref_name }}"
            git checkout ${{ github.ref_name }}
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            music-server/package-lock.json
            package-lock.json

      - name: Install music-webui dependencies
        run: npm ci

      - name: Install music-server dependencies
        run: npm ci
        working-directory: music-server

      - name: Start backend
        run: |
          LOG_FILE="$RUNNER_TEMP/api.log"
          npm run start:test > "$LOG_FILE" 2>&1 &
        working-directory: music-server

      - name: Wait for backend to start
        run: |
          LOG_FILE="$RUNNER_TEMP/api.log"
          EXPECTED='LOG [IndexerService] [accountId: 1 rootPathId: 2] adding folder'
          for i in $(seq 1 120); do
            if sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$LOG_FILE" 2>/dev/null |
              grep -Fq "$EXPECTED"; then
              echo "Backend startup message detected"
              exit 0
            fi
            echo "Waiting for backend startup message... attempt $i/120"
            sleep 1
          done
          echo "Backend did not emit the expected startup message within 120 seconds"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --workers 1

      - name: Backend debugging logs
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/api.log" ]; then
            tail -n 200 "$RUNNER_TEMP/api.log" || true
          else
            echo "No api.log found at $RUNNER_TEMP/api.log"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
