name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Clone music-server repo
        run: |
          git clone https://github.com/${{ github.repository_owner }}/music-server.git ../music-server

      - name: Install music-server dependencies
        run: npm ci
        working-directory: ../music-server

      - name: Start test stack (backend + db)
        run: npm run start:test > "$RUNNER_TEMP/api.log" 2>&1 &
        working-directory: ../music-server

      - name: Wait for backend to start
        run: |
          for i in {1..60}; do
            RESPONSE=$(curl -sS http://localhost:7100/api/guest/healthcheck 2>&1 || true)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7100/api/guest/healthcheck || echo "Request failed")
            if [ "$STATUS" -eq 200 ]; then
              exit 0
            fi
            echo "Waiting for backend to start... (attempt $i, status: $STATUS, response: $RESPONSE)"
            sleep 1
          done
          echo "Backend failed to start within 60 seconds"
          exit 1

      - name: Install Playwright test dependencies
        run: npm ci
        working-directory: ./

      - name: Run Playwright tests
        run: npx playwright test

      - name: Backend debugging logs
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/api.log" ]; then
            tail -n 200 "$RUNNER_TEMP/api.log" || true
          else
            echo "No api.log found at $RUNNER_TEMP/api.log"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
